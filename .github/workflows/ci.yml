name: C++ Build and Mock Integration
on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Configure
        run: cmake --preset ${{ runner.os == 'Windows' && 'windows-vs2022' || 'linux' }}
      - name: Build
        run: cmake --build --preset ${{ runner.os == 'Windows' && 'windows-vs2022' || 'linux' }}
      - name: Test
        run: ctest --preset ${{ runner.os == 'Windows' && 'windows-vs2022' || 'linux' }}
