name: VS2022/Linux FTXUI Build and Mock Tests
on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Configure
        run: cmake --preset ${{ runner.os == 'Windows' && 'windows-vs2022' || 'linux' }}
      - name: Build
        run: cmake --build --preset ${{ runner.os == 'Windows' && 'windows-vs2022' || 'linux' }}
      - name: Test
        run: ctest --preset ${{ runner.os == 'Windows' && 'windows-vs2022' || 'linux' }}

      - name: Verify native VS2022 solution sources
        run: python tools/verify_vs2022.py
      - name: Setup MSBuild
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2
      - name: Build checked-in VS2022 solution
        if: runner.os == 'Windows'
        shell: pwsh
        run: msbuild myVoice.sln /m /p:Configuration=Release /p:Platform=x64 /v:minimal
      - name: Smoke-test checked-in VS2022 binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ".\\build\\vs2022-native\\x64\\Release\\myvoice_cli.exe" /help
          & ".\\build\\vs2022-native\\x64\\Release\\myvoice_shell_tests.exe"
