name: Import vendored voice engines (one-time)
on:
  push:
    branches:
      - feat/vendor-rvc-seed-vc
    paths:
      - .github/workflows/vendor-engines.yml
permissions:
  contents: write
jobs:
  vendor-source:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout myVoice feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Checkout pinned RVC source (MIT)
        uses: actions/checkout@v4
        with:
          repository: RVC-Project/Retrieval-based-Voice-Conversion-WebUI
          ref: 81eed5e8f68b6bed1789f682fe78cdd324495afc
          path: third_party/rvc
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - name: Checkout pinned Seed-VC source (GPL-3.0)
        uses: actions/checkout@v4
        with:
          repository: Plachtaa/seed-vc
          ref: 51383efd921027683c89e5348211d93ff12ac2a8
          path: third_party/seed-vc
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - name: Remove repository metadata and nonessential reference media
        shell: bash
        run: |
          set -euo pipefail
          rm -rf third_party/rvc/.git third_party/seed-vc/.git
          rm -f third_party/rvc/.gitmodules
          # Sample songs and celebrity recordings are not required for inference and should not be republished.
          rm -rf third_party/seed-vc/examples third_party/seed-vc/assets/real-time-demo.webm
          # Large pretrained tensors are model assets, not source; model provisioning is documented separately.
          rm -f third_party/seed-vc/campplus_cn_common.bin
          rm -f third_party/seed-vc/baselines/dnsmos/*.onnx
          test -f third_party/rvc/infer/cli.py
          test -f third_party/rvc/train/train.py
          test -f third_party/rvc/train/preprocess.py
          test -f third_party/seed-vc/inference.py
          test -f third_party/seed-vc/inference_v2.py
          test -f third_party/rvc/LICENSE
          test -f third_party/seed-vc/LICENSE
      - name: Commit source snapshots into myVoice branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f third_party/rvc third_party/seed-vc
          if git diff --cached --quiet; then
            echo "No source files to import"
            exit 0
          fi
          git commit -m "vendor: add pinned RVC and Seed-VC source snapshots"
          git push origin "HEAD:feat/vendor-rvc-seed-vc"
